:10px}.pstats b{font:800 14px/1 var(--display)}.toolhint{background:var(--surface);border:1px solid var(--line);width:max-content;color:var(--muted);text-align:center;pointer-events:none;border-radius:999px;max-width:calc(100% - 32px);margin:0 auto;padding:5px 12px;font-size:12px;position:absolute;top:10px;left:10px;right:10px}.toolhint:empty{display:none}.banner{align-items:center;gap:10px;display:flex;top:auto;bottom:16px}.banner .btn{font:600 12.5px var(--body)}.pal{cursor:pointer;color:#fff;width:24px;height:24px;font:700 11px/1 var(--display);text-shadow:0 1px 1px #0006;border:2px solid #0000;border-radius:7px;padding:0}.pal[aria-pressed=true]{border-color:var(--sel);box-shadow:inset 0 0 0 2px var(--surface)}.tube-card{border:1px solid var(--line);border-radius:10px;margin-top:8px;padding:8px 10px}.tube-card.on{border-color:var(--accent)}.tube-card header{align-items:center;gap:6px;margin-bottom:6px;display:flex}.tube-card header b{flex:1}.setrow{border-radius:7px;grid-template-columns:22px 1fr auto auto;align-items:center;gap:6px;padding:3px 4px;display:grid}.setrow.on{background:var(--tint)}.setrow .pc{border-radius:5px;width:20px;height:20px}.setrow select{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:2px 4px}.setrow .k{font:11px var(--mono);color:var(--muted)}a.rbtn{text-decoration:none}.rail-foot .rbtn{font-size:11.5px}.grp{flex-wrap:wrap}.lv .m b.hard{color:#e5484d;font-weight:700}.stat{grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px;display:grid}.stat div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 8px}.stat b{font:800 18px/1.1 var(--display);display:block}.stat span{color:var(--muted);font-size:11px}@media (width<=900px){.toolhint{display:none}#view{min-height:70vh}.bar{padding:6px}.grp{border-right:0}}

<body>
<div class="app">
  <aside class="rail" aria-label="Levels">
    <div class="brand">
      <svg viewBox="0 0 30 30" aria-hidden="true"><rect x="9" y="2" width="12" height="13" rx="3" fill="#8FB1FF" opacity=".5"/><rect x="11" y="9" width="8" height="5" rx="1.5" fill="#D9363E"/><rect x="8" y="17" width="14" height="12" rx="3.5" fill="#D9363E"/><ellipse cx="15" cy="17.5" rx="7" ry="2" fill="#F472B6"/></svg>
      <div><h1>Bottle Fill Jam</h1><p>Level builder</p></div>
    </div>
    <div class="rail-tools"><input type="search" id="lvSearch" placeholder="Filter levels (id, number, element)" aria-label="Filter levels"></div>
    <div class="rail-tools">
      <button class="rbtn" id="lvNew" type="button">New</button>
      <button class="rbtn" id="lvDup" type="button">Duplicate</button>
      <button class="rbtn" id="lvUp" type="button" aria-label="Move level up">↑</button>
      <button class="rbtn" id="lvDown" type="button" aria-label="Move level down">↓</button>
      <button class="rbtn danger" id="lvDel" type="button">Delete</button>
    </div>
    <ul class="list" id="lvList"></ul>
    <div class="rail-foot">
      <button class="rbtn" id="btnImport" type="button">Import</button>
      <button class="rbtn" id="btnExport" type="button">Export</button>
      <button class="rbtn danger" id="btnReset" type="button">Reset to built-in levels</button>
      <a class="rbtn" target="_blank" rel="noopener" href="https://hvtanh07.github.io/gdd-bottle-fill-jam/">GDD ↗</a>
      <small id="saveNote">Changes are saved in this browser.</small>
    </div>
  </aside>

  <section class="mid" aria-label="Level">
    <div class="bar">
      <span class="lvtitle" id="lvTitle">level_001</span>
      <div class="seg" role="group" aria-label="Mode">
        <button type="button" id="modeEdit" aria-pressed="true">Design</button>
        <button type="button" id="modePlay" aria-pressed="false">Play test</button>
      </div>
      <div class="grp" data-edit>
        <button class="tb" id="tUndo" type="button" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg><span class="lbl">Undo</span></button>
        <button class="tb" id="tRedo" type="button" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg><span class="lbl">Redo</span></button>
      </div>
      <div class="grp tools" data-edit role="group" aria-label="Tools" id="tools">
        <button class="tb" data-tool="select" type="button" title="Select and move (V). Drag bottles; drag on empty board to box-select.">Select</button>
        <button class="tb" data-tool="bottle" type="button" title="Add a bottle (B). Click on a bottle to stack one on top.">Bottle</button>
        <button class="tb" data-tool="paint" type="button" title="Paint (P): click a bottle or jam set to give it the current color">Paint</button>
        <button class="tb" data-tool="erase" type="button" title="Erase (E): click a bottle or jam set to delete it">Erase</button>
        <button class="tb" data-tool="lock" type="button" title="Locked Bottle (L): click a bottle to lock or unlock it">Lock</button>
        <button class="tb" data-tool="shape" type="button" title="Shape (S): drag on the board to lay bottles along a line, arc, circle or spiral">Shape</button>
        <button class="tb" data-tool="stack" type="button" title="Stack (K): click for a deep column of bottles; drag to set the direction it goes back">Stack</button>
        <button class="tb" data-tool="hidden" type="button" title="Hidden Jam (H): click a jam set to hide or show it">Hidden</button>
      </div>
      <div class="grp" data-edit id="shapeOpts" role="group" aria-label="Shape options"></div>
      <div class="grp" data-edit id="palette" role="group" aria-label="Color"></div>
      <div class="grp" data-edit>
        <button class="tb" id="tZ" type="button" aria-pressed="false" title="Show layer numbers (Z)">Layers</button>
        <button class="tb" id="tGrid" type="button" aria-pressed="true" title="Show the board grid (G)">Grid</button>
        <label class="hint" for="snapSel">Snap</label><select id="snapSel" title="Snap for placing and moving bottles"><option value="0">Off</option><option value="0.05">0.05</option><option value="0.1">0.1</option><option value="0.25">0.25</option><option value="0.5">0.5</option><option value="1">1</option></select>
      </div>
      <div class="grp" data-play hidden>
        <button class="tb" id="pRestart" type="button" title="Restart (R)"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span class="lbl">Restart</span></button>
        <button class="tb" id="pUndo" type="button" title="Undo move (Ctrl+Z)">Undo move</button>
        <button class="tb" id="pBot" type="button" title="Bot plays one move (N)">Bot move</button>
        <button class="tb" id="pAuto" type="button" aria-pressed="false" title="Let the bot play">Bot plays</button>
        <button class="tb" id="pFast" type="button" aria-pressed="false" title="Fast pours">Fast</button>
      </div>
      <div class="grp" data-play hidden>
        <button class="bst" type="button" id="bExtra" title="Extra Tray: +1 tray slot, up to 5">Extra Tray <small id="bExtraN"></small></button>
        <button class="bst" type="button" id="bShuffle" title="Shuffle: mixes the jam sets">Shuffle <small id="bShuffleN"></small></button>
        <button class="bst" type="button" id="bRemove" title="Remove: takes 3 bottles off the board, with their jam">Remove <small id="bRemoveN"></small></button>
      </div>
      <span class="spacer"></span>
      <button class="tb" id="tCopy" type="button" title="Copy this level's JSON"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2.5"/><path d="M16 8V5.5A2.5 2.5 0 0 0 13.5 3h-7A2.5 2.5 0 0 0 4 5.5v8A2.5 2.5 0 0 0 6.5 16H8"/></svg><span class="lbl">Copy JSON</span></button>
    </div>
    <div class="stage">
      <svg id="view" role="application" aria-label="Level. In Design, click to add and select. In Play test, tap a free bottle to send it up." preserveAspectRatio="xMidYMid meet"><g id="static"></g><g id="bottles"></g><g id="ui"></g></svg>
      <div class="pstats" id="pStats" data-play hidden></div>
      <div class="toolhint" id="toolHint" data-edit></div>
      <div class="banner" id="banner" hidden></div>
    </div>
  </section>

  <aside class="insp" aria-label="Inspector">
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="level" aria-selected="true">Level</button>
      <button role="tab" data-tab="tubes" aria-selected="false">Tubes</button>
      <button role="tab" data-tab="bottles" aria-selected="false">Bottles</button>
      <button role="tab" data-tab="gen" aria-selected="false">Generate</button>
      <button role="tab" data-tab="check" aria-selected="false">Check <span class="badge" id="chkBadge">0</span></button>
      <button role="tab" data-tab="json" aria-selected="false">JSON</button>
      <button role="tab" data-tab="help" aria-selected="false">Help</button>
    </div>
    <div class="pane" id="pane"></div>
  </aside>
</div>

<div class="modal" id="modal" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <header><h2 id="dlgTitle">Import</h2><button class="ib" id="dlgX" type="button" aria-label="Close">✕</button></header>
    <div class="bd" id="dlgBody"></div>
    <footer id="dlgFoot"></footer>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
</body>
</html>
